---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actual-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://actual.${domain}"
    gethomepage.dev/group: Productivity & Tools
    gethomepage.dev/name: Actual Budget
    gethomepage.dev/icon: sh-actual-budget
    gethomepage.dev/description: Budgeting & Finance
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`actual.${domain}`)
      services:
        - kind: Service
          name: actual-actualserver
          namespace: actual
          port: 10293
  tls:
    secretName: wildcard-certificate-secret
