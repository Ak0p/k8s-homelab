---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: actual
  namespace: actual
spec:
  interval: 5m
  chart:
    spec:
      chart: actualserver
      version: 16.5.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    image:
      pullPolicy: Always
      tag: 26.6.0
    persistence:
      data:
        enabled: true
        type: pvc
        retain: true
        accessModes: ReadWriteMany
        size: 10Gi
        storageClass: host-zfs-files
