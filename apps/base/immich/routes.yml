---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: immich-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://immich.${domain}"
    gethomepage.dev/group: Media & Storage
    gethomepage.dev/name: Immich
    gethomepage.dev/icon: sh-immich
    gethomepage.dev/description: Photo & Video Library
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`immich.${domain}`)
      services:
        - kind: Service
          name: immich-server
          namespace: immich
          port: 2283
  tls:
    secretName: wildcard-certificate-secret
