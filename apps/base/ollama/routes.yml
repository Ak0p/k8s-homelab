---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: ollama-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://ollama.${domain}"
    gethomepage.dev/group: AI & Auth
    gethomepage.dev/name: Ollama
    gethomepage.dev/icon: ollama
    gethomepage.dev/description: Local LLM Inference
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`ollama.${domain}`)
      services:
        - kind: Service
          name: ollama
          namespace: ollama
          port: 11434
  tls:
    secretName: wildcard-certificate-secret
