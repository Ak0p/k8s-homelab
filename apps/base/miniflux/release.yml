---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: miniflux
  namespace: miniflux
spec:
  interval: 5m
  chart:
    spec:
      chart: miniflux
      version: 18.9.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    secret:
      miniflux-admin-credentials:
        enabled: false
    workload:
      main:
        podSpec:
          containers:
            main:
              env:
                CREATE_ADMIN: 1
                DATABASE_URL:
                  secretKeyRef:
                    name: cnpg-main-urls
                    key: std
                RUN_MIGRATIONS: 1
                ADMIN_USERNAME:
                  secretKeyRef:
                    name: miniflux-admin-credentials
                    key: admin-username
                    expandObjectName: false
                ADMIN_PASSWORD:
                  secretKeyRef:
                    name: miniflux-admin-credentials
                    key: admin-password
                    expandObjectName: false
