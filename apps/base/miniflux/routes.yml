---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: miniflux-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://miniflux.${domain}"
    gethomepage.dev/group: Productivity & Tools
    gethomepage.dev/name: Miniflux
    gethomepage.dev/icon: sh-miniflux
    gethomepage.dev/description: Minimal RSS Feed Reader
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`miniflux.${domain}`)
      services:
        - kind: Service
          name: miniflux
          namespace: miniflux
          port: 10091
  tls:
    secretName: wildcard-certificate-secret
