---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shelfarr-data
  namespace: books
spec:
  storageClassName: host-zfs-files
  resources:
    requests:
      storage: 5Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ebooks
  namespace: books
spec:
  storageClassName: host-zfs-files
  resources:
    requests:
      storage: 50Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: downloads
  namespace: books
spec:
  storageClassName: host-zfs-files
  resources:
    requests:
      storage: 100Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteMany
