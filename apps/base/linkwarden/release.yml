---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: linkwarden
  namespace: linkwarden
spec:
  interval: 5m
  chart:
    spec:
      chart: linkwarden
      version: 8.5.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    config:
      nextauth_url: "http://localhost:3000/api/auth"

    persistence:
      data:
        enabled: true
        type: pvc
        retain: true
        accessModes: ReadWriteMany
        size: 20Gi
        storageClass: host-zfs-files
