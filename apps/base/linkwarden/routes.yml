---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkwarden-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik.${domain}
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`linkwarden.${domain}`)
      services:
        - kind: Service
          name: linkwarden
          namespace: linkwarden
          port: 2985
  tls:
    secretName: wildcard-certificate-secret
