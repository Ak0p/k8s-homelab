---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: linkwarden-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://linkwarden.${domain}"
    gethomepage.dev/group: Productivity & Tools
    gethomepage.dev/name: Linkwarden
    gethomepage.dev/icon: sh-linkwarden
    gethomepage.dev/description: Bookmark Manager
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`linkwarden.${domain}`)
      services:
        - kind: Service
          name: linkwarden
          namespace: linkwarden
          port: 2985
  tls:
    secretName: wildcard-certificate-secret
