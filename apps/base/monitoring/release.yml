---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 87.19.1
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  values:
    alertmanager:
      enabled: false
    grafana:
      enabled: true
      assertNoLeakedSecrets: false
      admin:
        existingSecret: grafana-admin-credentials
      grafana.ini:
        server:
          domain: grafana.${domain}
          root_url: https://grafana.${domain}/
        auth.generic_oauth:
          enabled: true
          name: Pocket ID
          client_id: ${grafana_client_id}
          client_secret: ${grafana_client_secret}
          scopes: "openid email profile"
          auth_url: https://auth.${domain}/authorize
          token_url: https://auth.${domain}/api/oidc/token
          auth_style: auto
          skip_org_role_sync: true

    prometheus:
      prometheusSpec:
        initContainers:
          - name: fix-permissions
            image: busybox
            command: ["sh", "-c", "chown -R 1000:2000 /prometheus"]
            volumeMounts:
              - name: prometheus-prometheus-stack-kube-prom-prometheus-db
                mountPath: /prometheus
            securityContext:
              runAsUser: 0
              runAsNonRoot: false
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: host-zfs-standard
              accessModes: ["ReadWriteMany"]
              resources:
                requests:
                  storage: 50Gi
