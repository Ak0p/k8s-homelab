---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://grafana.${domain}"
    gethomepage.dev/group: Media & Storage
    gethomepage.dev/name: Grafana
    gethomepage.dev/icon: sh-grafana
    gethomepage.dev/description: Metrics & Dashboards
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.${domain}`)
      services:
        - kind: Service
          name: prometheus-stack-grafana
          namespace: monitoring
          port: 80
  tls:
    secretName: wildcard-certificate-secret
