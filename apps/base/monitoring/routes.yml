---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-route
  namespace: monitoring
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik.${domain}
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`grafana.${domain}`)
      services:
        - kind: Service
          name: prometheus-stack-grafana
          namespace: monitoring
          port: 80
  tls:
    secretName: wildcard-certificate-secret
