---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: deluge-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://deluge.${domain}"
    gethomepage.dev/group: Productivity & Tools
    gethomepage.dev/name: Deluge
    gethomepage.dev/icon: sh-deluge
    gethomepage.dev/description: BitTorrent Client
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`deluge.${domain}`)
      services:
        - kind: Service
          name: deluge
          namespace: arr
          port: 8112
  tls:
    secretName: wildcard-certificate-secret
