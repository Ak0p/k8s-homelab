---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: deluge
  namespace: arr
spec:
  interval: 5m
  chart:
    spec:
      chart: deluge
      version: 22.7.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    persistence:
      config:
        enabled: true
        type: pvc
        retain: true
        accessModes: ReadWriteMany
        size: 300Gi
        storageClass: host-zfs-files
