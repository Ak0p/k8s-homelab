apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sftpgo-webdav-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://dav.sftpgo.${domain}"
    gethomepage.dev/group: Media & Storage
    gethomepage.dev/name: SFTPGo WebDAV
    gethomepage.dev/icon: sftpgo
    gethomepage.dev/description: WebDAV File Access
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`dav.sftpgo.${domain}`)
      services:
        - kind: Service
          name: sftpgo-webdavport
          namespace: sftpgo
          port: 10080
  tls:
    secretName: storage-certificate-secret
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sftpgo-admin-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://dash.sftpgo.${domain}"
    gethomepage.dev/group: Media & Storage
    gethomepage.dev/name: SFTPGo Admin
    gethomepage.dev/icon: sftpgo
    gethomepage.dev/description: SFTP Server Management
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`dash.sftpgo.${domain}`)
      services:
        - kind: Service
          name: sftpgo
          namespace: sftpgo
          port: 2221
  tls:
    secretName: storage-certificate-secret
