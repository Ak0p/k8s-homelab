apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: audiobookshelf-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://abs.${domain}"
    gethomepage.dev/group: Media & Storage
    gethomepage.dev/name: AudiobookShelf
    gethomepage.dev/icon: sh-audiobookshelf
    gethomepage.dev/description: Audiobook Management & Streaming
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`abs.${domain}`)
      services:
        - kind: Service
          name: audiobookshelf
          namespace: books
          port: 10223
  tls:
    secretName: wildcard-certificate-secret
