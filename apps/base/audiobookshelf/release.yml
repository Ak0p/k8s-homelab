---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: audiobookshelf
  namespace: books
spec:
  interval: 5m
  chart:
    spec:
      chart: audiobookshelf
      version: 13.10.0
      sourceRef:
        kind: HelmRepository
        name: truecharts
        namespace: flux-system
  values:
    fullnameOverride: audiobookshelf
    persistence:
      config:
        enabled: true
        type: pvc
        size: 5Gi
        storageClass: host-zfs-files
      metadata:
        enabled: true
        type: pvc
        size: 5Gi
        storageClass: host-zfs-files
      audiobooks:
        enabled: true
        type: pvc
        existingClaim: audiobooks
