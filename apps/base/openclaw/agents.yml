apiVersion: openclaw.rocks/v1alpha1
kind: OpenClawInstance
metadata:
  name: jarvis
  namespace: openclaw
spec:
  envFrom:
    - secretRef:
        name: openclaw-api-keys
  storage:
    persistence:
      enabled: true
      size: 30Gi
      storageClass: host-zfs-files
      accessModes:
        - ReadWriteMany
