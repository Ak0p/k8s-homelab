---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actual-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik.${domain}
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`actual.${domain}`)
      services:
        - kind: Service
          name: actual-actualserver
          namespace: actual
          port: 10293
  tls:
    secretName: wildcard-certificate-secret
