services:
  docs:
    container_name: docs
    image: mcr.microsoft.com/devcontainers/typescript-node:4-24-trixie
    network_mode: host
    working_dir: /workspace
    volumes:
      - .:/workspace:cached
    environment:
      - WATCHPACK_POLLING=true
    entrypoint: /bin/sh
    command: ["-c", "npm install && npm run start"]