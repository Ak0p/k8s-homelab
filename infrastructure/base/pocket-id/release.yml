apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
    name: pocket-id
    namespace: pocket-id
spec:
    releaseName: pocket-id
    chart:
        spec:
            chart: pocket-id
            version: 1.0.0
            sourceRef:
                kind: HelmRepository
                name: truecharts
                namespace: flux-system
    interval: 60m
    values:
        persistence:
            data:
                enabled: true
                storageClass: host-zfs-standard
                type: pvc
                size: 5Gi
                retain: true
        workload:
            main:
                podSpec:
                    containers:
                        main:
                            env:
                                APP_URL: https://auth.${domain}
                                ENCRYPTION_KEY:
                                    secretKeyRef:
                                        name: pocket-id
                                        key: encryption-key
                                        expandObjectName: false
