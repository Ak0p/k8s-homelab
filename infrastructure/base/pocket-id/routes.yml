---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocket-id-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://auth.${domain}"
    gethomepage.dev/group: AI & Auth
    gethomepage.dev/name: Pocket ID
    gethomepage.dev/icon: sh-pocket-id
    gethomepage.dev/description: Authentication & SSO
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`auth.${domain}`)
      services:
        - kind: Service
          name: pocket-id
          namespace: pocket-id
          port: 1411
  tls:
    secretName: wildcard-certificate-secret
