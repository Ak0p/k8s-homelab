---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: pocket-id-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: traefik.${domain}
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`auth.${domain}`)
      services:
        - kind: Service
          name: pocket-id
          namespace: pocket-id
          port: 1411
  tls:
    secretName: wildcard-certificate-secret
