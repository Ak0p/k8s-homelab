apiVersion: velero.io/v1
kind: Schedule
metadata:
  name: daily-backup
  namespace: velero
spec:
  schedule: "0 0 * * *"
  template:
    includedNamespaces:
      - "*"
    includedResources:
      - persistentvolumeclaims
      - persistentvolumes
    snapshotVolumes: true
    snapshotMoveData: true
    ttl: 720h0m0s
