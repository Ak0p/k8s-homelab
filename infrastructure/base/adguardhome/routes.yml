apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: adguardhome-ui
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${main_traefik_ip}
    kubernetes.io/ingress.class: traefik
    gethomepage.dev/enabled: "true"
    gethomepage.dev/pod-selector: ""
    gethomepage.dev/href: "https://adguardhome.${domain}"
    gethomepage.dev/group: Media & Storage
    gethomepage.dev/name: AdGuard Home
    gethomepage.dev/icon: adguard-home
    gethomepage.dev/description: DNS & Ad Blocking
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`adguardhome.${domain}`)
      services:
        - name: adguardhome-adguard-home
          namespace: adguardhome
          port: 10232
  tls:
    secretName: wildcard-certificate-secret
