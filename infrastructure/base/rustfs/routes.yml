---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-storage-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${backup_traefik_ip}
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`s3.rustfs.${domain}`)
      services:
        - name: rustfs-svc
          namespace: rustfs
          port: 9000
  tls:
    secretName: rustfs-storage-certificate-secret
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rustfs-dash-route
  namespace: traefik
  annotations:
    external-dns.alpha.kubernetes.io/target: ${backup_traefik_ip}
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`dash.rustfs.${domain}`)
      services:
        - name: rustfs-svc
          namespace: rustfs
          port: 9001
  tls:
    secretName: rustfs-storage-certificate-secret
