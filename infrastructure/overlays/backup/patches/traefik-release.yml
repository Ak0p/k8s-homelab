- op: replace
  path: /spec/values/service/single
  value: true

- op: replace
  path: /spec/values/service/annotations/external-dns.alpha.kubernetes.io~1hostname
  value: traefik-backup.${domain}

- op: replace
  path: /spec/values/ingressRoute/dashboard/matchRule
  value: Host(`traefik-backup.${domain}`)
